- name: Initialize cluster
  ansible.builtin.command: >-
    kubeadm init --control-plane-endpoint {{ api_vip }}:{{ api_frontend_port }}
    --upload-certs --pod-network-cidr {{ pod_cidr }}
  args: {creates: /etc/kubernetes/admin.conf}
- name: Download Cilium CLI archive
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/v{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz"
    dest: /tmp/cilium-linux-amd64.tar.gz
    mode: '0644'
- name: Download Cilium CLI checksum
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/v{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz.sha256sum"
    dest: /tmp/cilium-linux-amd64.tar.gz.sha256sum
    mode: '0644'
- name: Verify Cilium CLI archive
  ansible.builtin.command: sha256sum --check cilium-linux-amd64.tar.gz.sha256sum
  args: {chdir: /tmp}
  changed_when: false
- name: Install Cilium CLI
  ansible.builtin.unarchive: {src: /tmp/cilium-linux-amd64.tar.gz, dest: /usr/local/bin, remote_src: true, creates: /usr/local/bin/cilium}
- name: Check Cilium status
  ansible.builtin.command: cilium status --kubeconfig /etc/kubernetes/admin.conf --wait-duration 5s
  register: bootstrap_control_plane_cilium_status
  changed_when: false
  failed_when: false
- name: Install Cilium
  ansible.builtin.command: "cilium install --version {{ cilium_version }} --kubeconfig /etc/kubernetes/admin.conf"
  when: bootstrap_control_plane_cilium_status.rc != 0
  changed_when: true
- name: Wait for Cilium
  ansible.builtin.command: cilium status --kubeconfig /etc/kubernetes/admin.conf --wait --wait-duration 5m
  changed_when: false
- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: bootstrap_control_plane_worker_join
  changed_when: false
  no_log: true
- name: Generate certificate key
  ansible.builtin.command: kubeadm init phase upload-certs --upload-certs
  register: bootstrap_control_plane_cert_key
  changed_when: false
  no_log: true
- name: Store join data in memory
  ansible.builtin.set_fact:
    bootstrap_control_plane_worker_join_command: "{{ bootstrap_control_plane_worker_join.stdout }}"
    bootstrap_control_plane_join_command: >-
      {{ bootstrap_control_plane_worker_join.stdout }} --control-plane
      --certificate-key {{ bootstrap_control_plane_cert_key.stdout_lines[-1] }}
  no_log: true
