- name: Install repository dependencies
  ansible.builtin.apt: {name: [ca-certificates, curl, gpg], state: present, update_cache: true}
- name: Create apt keyring directory
  ansible.builtin.file: {path: /etc/apt/keyrings, state: directory, mode: '0755'}
- name: Install Kubernetes repository key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: '0644'
- name: Configure Kubernetes repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes.asc]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /
    filename: kubernetes
    state: present
- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_version }}"
      - "kubeadm={{ kubernetes_package_version }}"
      - "kubectl={{ kubernetes_package_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections: {name: "{{ item }}", selection: hold}
  loop: [kubelet, kubeadm, kubectl]
